    <div class="container">
        <h2>Form Demo</h2>
        <form action="#">
           <div class="row">
                 <div class="mb-3 col-md-4">
                <label for="email" class="form-label" >Email</label>
                <input id="email" type="text" class="form-control" placeholder="Email">
            </div>
            <div class="mb-3 col-md-4">
                <label for="pass" class="form-label" >Password</label>
                <input id="pass" type="password" class="form-control" placeholder="password">
            </div>
            <div class="mb-3 col-md-4">
                <label for="address" class="form-label" >Address</label>
                <input id="address" type="text" class="form-control-lg" placeholder="address">
            </div>
           </div>
            <div class="mb-3">
                <select name="bootstrap" id="bootstrap" class="form-select">
                    <option selected>Choose your city</option>
                    <option value="one">Mumbai</option>
                    <option value="two">Delhi</option>
                    <option value="3">Noida</option>
                </select>
            </div>
            <div class="normal mb-3 form-check">
                <label for="agreebs" class="form-check-label">agree</label>
                <input type="checkbox" id="agreebs" class="form-check-input">
            </div>
            <div class="normal mb-3 form-check">
                <label for="radiobs" class="form-check-label">agree</label>
                <input type="radio" id="radiobs" class="form-check-input">
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault">
                <label class="form-check-label" for="switchCheckDefault">Default switch checkbox input</label>
                </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
