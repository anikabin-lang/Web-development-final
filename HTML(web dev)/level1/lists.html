<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists in html</title>
</head>
<body>
    <ul>
        <li><h2>Want to buy:</h2></li>
        <li>Apple</li>
        <li>Banana</li>
    </ul>
    <ol type="1">
        <li>Bread
            <ol>
                <li>White Bread</li>
                <li>Brown Bread</li>
            </ol>
        </li>
        <li>Apple</li>
        <li>Banana</li>
    </ol>
</body>
</html>
