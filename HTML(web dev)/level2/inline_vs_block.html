<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline vs Block elements</title>
</head>
<body>
    <!--Block elements-->
    <h1>Hello World</h1>
    <p>Hello World</p>
    <!--Inline elements-->
    <a href="https://www.google.com/">Google</a>
    <a href="https://www.youtube.com/">Youtube</a>
    <p>This is a lily image <img src="lily.webp" alt="lily" height="100px" width="100px"></p>
    <img src="lily.webp" alt="lily" height="100px" width="100px">
    <img src="lily.webp" alt="lily" height="100px" width="100px">
    <img src="lily.webp" alt="lily" height="100px" width="100px">
</body>
</html>
