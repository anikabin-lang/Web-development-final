<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form action="/action">
        <!-- Empty
        <input /> -->
        <div>
            
            <label for="username">Username</label>
            <input type="text" placeholder="Enter username" id="username">
            
        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" placeholder="Enter password" id="password">
            
        </div>
        <!--Classical label method ***most used*****-->
        <div>
            <label for="number">Enter Age:</label>
            <input type="number" id="number" placeholder="Enter age">
        </div>
        <div>
            <label for="time">Time</label>
            <input type="time" id="time" placeholder="Enter time">
        </div>
        <div>
            <label for="color">Color</label>
            <input type="color" id="color" placeholder="Enter color">
        </div>
        

    </form>
</body>
</html>
